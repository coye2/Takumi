name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Warm installed compilers before bounded syntax checks
        run: python scripts/warm_compilers.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q takumi
      - name: Frontend checks
        run: |
          node --check web/app.js
          node --check web/kage.js
          node scripts/test-markdown.cjs
          node tests/test_run_stream.cjs
          node tests/test_reconnect.cjs
          node tests/test_pwa_cache.cjs
          node --check web/mobile.js
          node --check web/sw.js
          node --check web/theme.js
  desktop:
    name: Windows desktop candidate (not a release)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop
        shell: pwsh
        run: ./scripts/Build-Windows-EXE.ps1
      - name: Package artifact
        shell: pwsh
        run: |
          $bad = Get-ChildItem -LiteralPath dist/Takumi-win-x64 -Recurse -File | Where-Object { $_.Name -match '^(ollama|opencode|claude|codex)(\.|$)' -or $_.Extension -in @('.gguf','.safetensors','.onnx') }
          if ($bad) { throw 'Unexpected AI engine or model weights in desktop output' }
          Compress-Archive -Path dist/Takumi-win-x64/* -DestinationPath Takumi-Windows-x64.zip
          $zip = Get-Item -LiteralPath 'Takumi-Windows-x64.zip'
          $sha = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($zip.Name)" | Set-Content -LiteralPath 'Takumi-Windows-x64.zip.sha256' -Encoding ascii
          $version = (& python -c 'from takumi.core import APP_VERSION; print(APP_VERSION)').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source version' }
          @{
            kind = 'UNVERIFIED_CANDIDATE_NOT_PUBLIC_RELEASE'
            source_repository = $env:GITHUB_REPOSITORY
            checked_out_commit = $env:GITHUB_SHA
            git_ref = $env:GITHUB_REF
            source_version = $version
            zip_bytes = $zip.Length
            zip_sha256 = $sha
            confirmed = @('Python tests on Windows and Ubuntu', 'Frontend checks', '.NET 10 publish', 'No weights/AI engines', 'SHA-256')
            unverified = @('Installed Windows app launch', 'Sumi/Rei inference', 'Upgrade and rollback', 'Paired phone integration')
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'release-candidate.json' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Takumi-Windows-x64-candidate
          path: |
            Takumi-Windows-x64.zip
            Takumi-Windows-x64.zip.sha256
            release-candidate.json
